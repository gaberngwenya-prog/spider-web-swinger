<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#09131f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Spider Swing</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="title">Spider Swing</div>
        <div id="status">Swing to the skyline</div>
      </div>

      <button id="installBtn" class="install-btn" type="button" hidden>Install App</button>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Spider swing game"></canvas>

      <div class="controls">
        <div class="touch-row">
          <button class="control-btn" data-control="left">◀</button>
          <button class="control-btn" data-control="right">▶</button>
        </div>
        <div class="touch-row">
          <button class="control-btn accent" data-control="jump">Jump</button>
          <button class="control-btn accent" data-control="swing">Web</button>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
